name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Mondays 04:17 UTC — off-peak, avoids GH-cron stampede
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  # Su un PULL REQUEST cancellare il run superato e' giusto: si itera in fretta e
  # conta solo l'ultimo. Su un PUSH SU MAIN no — ogni commit merita un verdetto, e
  # cancellarlo non lo rimanda: lo CANCELLA, perche' nessuno rilancia il run morto.
  #
  # MISURATO il 2026-08-10, con otto autori sullo stesso ramo:
  #   26 run cancellati su 40 · 4 cancellati contro 1 concluso in una sola serata
  #   il job piu' lento (windows) e' SEMPRE l'unico che perde: 0 conclusi su 12
  #   quattro push in 26 minuti -> ZERO verdetti completi
  # e mezza giornata di diagnosi si e' appoggiata su verdetti mai arrivati.
  #
  # Un run di `ci` dura ~45 minuti (matrice di sei: ubuntu 17,5 · macos 22,1 ·
  # windows 45,0). Perche' ne sopravviva uno servirebbe una finestra di silenzio
  # di 40 minuti: in otto e' un push ogni 5,3 ore a testa, cioe' un blocco.
  # La disciplina e' stata provata stasera e non ha retto — questa riga la
  # sostituisce con una regola che non dipende da chi si ricorda.
  # ⚠️⚠️ 2026-08-15 — LE QUINDICI RIGHE QUI SOPRA DESCRIVONO UNA CURA CHE QUESTO
  # FILE NON HA. Sono copiate parola per parola da `ci.yml`, compresa «ogni
  # commit merita un verdetto» e «una regola che non dipende da chi si ricorda»
  # — ma la riga che quel testo descrive e' il gruppo per COMMIT, ed e' entrata
  # solo in `ci.yml`. Qui il gruppo e' per REF: su `main` tutti i push lo
  # condividono, e chi arriva in coda viene scartato.
  #
  # MISURATO da ws3 il 15/08, sugli ultimi 50 run di ciascuno:
  #     ci          2 cancellati su 50
  #     security   21 cancellati su 50      <- tutti main + push
  #     solo oggi:  ci 0 su 18  ·  security 7 su 18
  #
  # ⇒ Ventuno verdetti di SICUREZZA mai dati, su main, sotto mandato di
  # rilascio. Il `cancel-in-progress` qui e' corretto (vero solo sui PR): non e'
  # lui il difetto — e' il gruppo, e il 12/08 si era gia' misurato che
  # `cancel-in-progress: false` protegge il run che GIRA, non quello in CODA.
  #
  # 🔑 PERCHE' LA RIGA NON E' ANCORA CAMBIATA, e non e' una dimenticanza:
  # allinearla fa girare 5 job per ogni commit oggi scartato — 35 job in piu'
  # nella sola giornata di oggi, misurati con 19 gia' in coda e il tetto dei
  # runner a 20. Il prezzo scritto in `ci.yml` dice di non farlo a coda satura.
  # ⚖️ Ma quel prezzo conta i JOB e non le CONSEGUENZE, e qui non sono
  # simmetriche: un verdetto di `ci` in ritardo si aspetta, un verdetto di
  # sicurezza mancante su main non torna. La decisione e' RIMANDATA, non
  # archiviata — e finche' dura, questo commento dice il vero al posto di quello
  # sopra, che descrive un altro file.
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Least-privilege default — fixes CodeQL `actions/missing-workflow-permissions`.
permissions:
  contents: read
  security-events: write   # required by codeql-action/upload-sarif

jobs:
  codeql:
    name: CodeQL (Python, custom config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  ruff-security:
    # ⚠️ «report-only» NEL NOME DEL JOB e non solo in quello del passo: nella
    # lista dei check di un commit si leggono i nomi dei JOB, non dei passi.
    # Il comando finisce in `|| true`, quindi questo verde dice «ho guardato»,
    # non «e' pulito» — e senza il marchio si legge come un verdetto.
    name: ruff (security rules, report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff S-rules (security, report-only)
        # A-3 (audit#2 2026-06-08): scan the REAL package `engram`. This used to
        # target the `hippoagent` deprecation shim (one __init__.py) so it scanned
        # ~0 LOC and passed trivially — SECURITY.md's "SAST on every change" was
        # materially false. Report-only for now (engram has ~192 pre-existing
        # S-findings to triage); CodeQL above is the blocking whole-tree gate.
        run: ruff check --select S verimem || true

  bandit:
    name: bandit (low+low report)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]
      - name: Bandit scan (report-only)
        # A-3 (audit#2 2026-06-08): scan the REAL package `engram` (was the empty
        # `hippoagent` shim). -ll low sev, -i low conf — report only (engram has
        # ~4 HIGH-sev findings to triage before this can gate; CodeQL gates).
        run: bandit -r verimem -ll -i || true

  pip-audit:
    name: pip-audit (HIGH/CRITICAL gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e ".[full,dev]"
      - name: pip-audit (project deps)
        # CVE-2025-3000 (torch, alias PYSEC-2025-194): CVSS4 AV:L/PR:L, all
        # impacts Low (~4.8 MEDIUM) — below this gate's declared HIGH/CRITICAL
        # bar — and OSV lists no fixed version yet (2026-06-10). Re-check when
        # torch publishes a fix.
        run: pip-audit --strict --vulnerability-service osv --ignore-vuln CVE-2025-3000

  safety:
    # ⚠️ Idem: `safety check --short-report || true`. Era l'unico dei tre
    # report-only a non dirlo ne' nel job ne' nel passo.
    name: safety check (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install safety
          pip install -e ".[full,dev]"
      - name: safety scan
        # Report only — do not fail the build until baseline is green.
        run: safety check --short-report || true
