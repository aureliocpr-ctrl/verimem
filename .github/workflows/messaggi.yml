# Il `git log` pubblico parla del prodotto, non della stanza in cui lavoriamo.
#
# Misurato il 12/09/2026 con lo script che questo workflow esegue, sugli ultimi
# quaranta commit del ramo principale (`d60cc326~40..d60cc326`):
#
#     oltre 10 righe    : 39
#     nome di sessione  : 24
#     nome utente       :  5
#     percorso locale   :  2
#     PULITI            :  0     <- zero su quaranta
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ AVEVO SCRITTO CHE I MESSAGGI DI UNA PR «NON ARRIVANO SU MAIN PERCHE' SI
# FONDE IN SQUASH». E' FALSO, E LA DIFFERENZA E' TUTTO IL DISEGNO DI QUESTO
# FILE. Chiesto alle impostazioni del repository invece di ricordarselo:
#
#     squash_merge_commit_message : COMMIT_MESSAGES
#     squash_merge_commit_title   : COMMIT_OR_PR_TITLE
#
# `COMMIT_MESSAGES` vuol dire che il corpo del commit di squash e' la
# CONCATENAZIONE dei messaggi dei commit della PR. ⇒ I messaggi di una PR
# arrivano su main per intero.
#
# 📌 E oggi ci arrivano lo stesso, per un'altra strada: le PR si sono fuse in
# REBASE (`allow_rebase_merge` acceso), che mette ogni messaggio su main uno per
# uno. Misurato sui sette commit dell'ultima PR fusa: zero sono antenati di
# main, ma i loro sette messaggi ci sono tutti, con SHA nuovi. In tutt'e due i
# modi il messaggio che scrive chi lavora e' quello che l'utente legge — che e'
# la ragione per cui questo controllo esiste.
#
# ⇒ Il controllo e' ROSSO sulla PR, non un avviso. Misurato prima di spedirlo —
# e il numero porta la sua POPOLAZIONE e la sua ORA, perche' dipende da quante
# PR sono aperte in quel momento e in mezza giornata si e' gia' mosso:
#
#     12/09 12:40, su 14 PR aperte : 14 rosse su 14 · 66 commit sporchi su  99
#     12/09 13:55, su 20 PR aperte : 17 rosse su 20 · 70 commit sporchi su 130
#
# Diciassette su venti e' un debito vero, non un falso allarme, e il
# rosso dice a ciascuna cosa le manca prima di entrare.
#
# 📌 E NON BLOCCA NESSUNO: `main` non ha protezione di ramo (`gh api
# .../branches/main/protection` -> «Branch not protected»), quindi nessun check
# e' richiesto per fondere. Questo rosso e' un segnale, non un cancello chiuso —
# e va detto, perche' chi vede un check rosso di solito conclude di essere
# bloccato.
#
# 🔑 LA CURA PER UNA PR GIA' SCRITTA NON E' RISCRIVERE IL RAMO: chi fonde
# compone a mano il messaggio dello squash, che e' quello che l'utente
# leggera'. Il messaggio dello squash lo scrive GitHub al momento della
# fusione e nessun hook lo vede prima: l'unico presidio e' la mano di chi
# fonde, e questo comando prima di confermare —
#
#     python scripts/messaggio_pulito.py --file <il messaggio dello squash>
#
# ⚠️ E UN ROSSO QUI NON FERMA UN TAG: il cancello del publish legge un solo
# workflow (`publish.yml`: `select(.name=="ci" and .head_branch=="main")`).
# Scritto perche' chi legge «CI verde» non concluda «anche i messaggi sono a
# posto». Cosa debba bloccare un tag e' una decisione che sta in `publish.yml`.
#
# ⚠️ PERCHE' UN WORKFLOW SEPARATO E NON UN JOB IN `ci.yml`: stesso motivo
# scritto in `presidi-lenti.yml` — `ci` e' lo strumento con cui si legge il gate
# del rilascio, e aggiungerci un job cambia cio' con cui si misura mentre lo si
# sta misurando. Quando la PR dei presidi entra in main questo job va dentro
# `presidi-pr.yml`: due file per lo stesso mestiere sono una copia, e le copie
# divergono.
name: messaggi

# ⚠️ `pull_request` SENZA `branches:`, di proposito. Con il filtro su `main`
# una PR impilata su un altro ramo non fa partire niente — e @ws1 ha misurato
# che due delle nostre (base `aldo/tetto` e `galileo/t-map-11-ground`) hanno
# ZERO check: `gh pr checks` non dice «rosso», dice **niente**, e il vuoto si
# legge come un verde. Una PR che aggiunge commit va controllata comunque, e
# `base...head` misura cio' che aggiunge qualunque sia la base.
#
# 📌 IL LIMITE, perche' non sembri piu' di quel che e': questo NON accende il
# controllo sulle due PR di oggi. Per un evento `pull_request` i workflow si
# leggono dal merge di base e testa, quindi finche' quelle basi non ripartono da
# un main che contiene questo file, il file li' non c'e' e non gira niente.
# ⇒ vale per le PR impilate da qui in avanti. (Ragionato, NON verificato: non
# ho un modo di provarlo senza fondere.)
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: messaggi-${{ github.ref }}
  # ⚠️ `false`, e il motivo l'ho misurato su questa stessa PR. Con
  # `cancel-in-progress: true` ogni push cancellava il run del push precedente:
  # cinque SHA su sette sono rimasti `cancelled`, cioe' SENZA VERDETTO — ed e'
  # esattamente il non-verdetto che `gh pr checks` stampa come `fail` e che ci
  # ha gia' fatto leggere come rossa una PR che non lo era.
  # Su un job da mezzo minuto non si risparmia niente e si comprano sette
  # righe ambigue: ogni SHA spinto merita una risposta.
  cancel-in-progress: false

jobs:
  messaggi:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Serve la storia: il controllo legge un INTERVALLO di commit, e su un
          # clone profondo 1 la base non e' raggiungibile — `git log A..B`
          # fallirebbe invece di tornare vuoto.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⚠️ PRIMA L'AUTOTEST, POI LA MISURA — come gli altri cricchetti. Un
      # controllo che non puo' diventare rosso e' un semaforo verde: qui si
      # prova che boccia cio' che deve e tace sul resto, e solo dopo si crede al
      # suo verdetto. Non installa niente: lo script usa la libreria standard.
      # 🔴 DUE autotest, non uno — rilievo del pari sulla #33 (12/09): l'elenco
      # dei nomi ha 21 casi che provano il suo criterio (le maiuscole per i nomi
      # che sono anche parole comuni, gli identificatori, i ruoli che NON sono
      # nomi) e **non li eseguiva nessuno**: ne' qui ne' il pytest. Un presidio
      # che nessuno esegue e uno che non esiste si equivalgono.
      #
      # ⚠️ E il primo dipende dal secondo: `messaggio_pulito` importa l'elenco.
      # Se il criterio dell'elenco si rompe, il cancello sbaglia senza che il
      # suo autotest se ne accorga — perche' i suoi casi non nominano `Varco`.
      - name: L'elenco dei nomi morde (autotest)
        run: python scripts/nomi_delle_sessioni.py --autotest

      - name: Il controllo morde (autotest)
        run: python scripts/messaggio_pulito.py --autotest

      - name: I messaggi di questa PR
        if: github.event_name == 'pull_request'
        run: |
          python scripts/messaggio_pulito.py \
            --range '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'

      # ⚠️ QUESTO PASSO NON HA MAI GIRATO quando l'ho scritto: `push: main` si
      # accende solo dopo la fusione, e un presidio mai eseguito e' un presidio
      # ignoto. Estratto ed eseguito a mano il 12/09 sui quattro casi che puo'
      # incontrare — questi sono gli esiti, non una previsione:
      #
      #   prima = tutti zeri (ramo nuovo)   -> ::notice NON HO MISURATO   EXIT=0
      #   prima = sha inesistente           -> ::notice NON HO MISURATO   EXIT=0
      #   push pulito  (7 messaggi)         -> VERDETTO: VERDE            EXIT=0
      #   push sporco  (7 messaggi su 7)    -> VERDETTO: ROSSO            EXIT=1
      #
      # 📌 E l'exit code va letto SENZA pipe: la prima volta l'ho letto con
      # `| tail -3` e il caso sporco diceva ROSSO con EXIT=0, perche' l'uscita
      # della pipe sostituisce quella del comando. E' la trappola contro cui
      # avvisa il nostro stesso strumento, e ci sono cascato provandone una.
      - name: I messaggi appena arrivati su main
        if: github.event_name == 'push'
        run: |
          PRIMA='${{ github.event.before }}'
          DOPO='${{ github.event.after }}'
          # Un ramo appena creato, o una storia riscritta, non hanno un «prima»
          # raggiungibile: senza questa guardia il passo fallirebbe per un
          # difetto del misuratore e si leggerebbe come un messaggio sporco.
          if [ -z "$PRIMA" ] || [ "$PRIMA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$PRIMA^{commit}" 2>/dev/null; then
            echo "::notice title=Messaggi::Nessun punto di partenza raggiungibile ($PRIMA): NON HO MISURATO NIENTE."
            exit 0
          fi
          python scripts/messaggio_pulito.py --range "$PRIMA..$DOPO"

      # A comando: una fotografia del debito, non un cancello. Non fallisce, o
      # diventerebbe un rosso permanente su una storia che non riscriviamo.
      - name: Fotografia degli ultimi 40 (a comando)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/messaggio_pulito.py --range "HEAD~40..HEAD" || true
